name: Build Firmware

on:
  push:
    branches: [ testing ]
    paths:
      - "canboard_config.h"
      - "**/*.c"
      - "**/*.h"
      - "Makefile"
      - ".github/workflows/build_firmware_testing.yml"
  pull_request:
    paths:
      - "canboard_config.h"
      - "**/*.c"
      - "**/*.h"
      - "Makefile"
      - ".github/workflows/build_firmware_testing.yml"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Extract version number
        id: extract_version
        run: |
          MAJOR=$(grep '#define MAJOR_VERSION' canboard_config.h | awk '{print $3}')
          MINOR=$(grep '#define MINOR_VERSION' canboard_config.h | awk '{print $3}')
          BUILD=$(grep '#define BUILD' canboard_config.h | awk '{print $3}')
          VERSION="${MAJOR}.${MINOR}.${BUILD}"
          VERSION_DASHED="${MAJOR}-${MINOR}-${BUILD}"

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_DASHED=$VERSION_DASHED" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_dashed=$VERSION_DASHED" >> $GITHUB_OUTPUT

      - name: Delete existing testing-latest release if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/testing-latest \
            | jq -r '.id // empty')

          if [ -n "$RELEASE_ID" ]; then
            echo "Deleting existing release $RELEASE_ID"
            curl -s -X DELETE \
              -H "Authorization: token $GH_TOKEN" \
              https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID
          fi

          # Delete the tag so it can be recreated at the new commit
          git push origin :refs/tags/testing-latest || true

      - name: Download & Install ARM GCC Toolchain
        run: |
          wget 'https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz' -O compiler.tar.xz
          tar -xf compiler.tar.xz
          echo "$(pwd)/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH

      - name: Verify Compiler
        run: arm-none-eabi-gcc -v

      - name: Build Firmware Variants
        run: |
          set -e

          make clean
          make
          cp build/CANBoard.hex build/CANBoard_FW_v${VERSION_DASHED}.hex
          cp build/CANBoard.bin build/CANBoard_FW_v${VERSION_DASHED}.bin
          cp build/CANBoard.elf build/CANBoard_FW_v${VERSION_DASHED}.elf

          ls -l build/
        env:
          VERSION_DASHED: ${{ steps.extract_version.outputs.version_dashed }}

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: testing-latest
          name: Testing v${{ steps.extract_version.outputs.version }}
          prerelease: true
          body: |
            ## Testing Pre-Release v${{ steps.extract_version.outputs.version }}

            > [!WARNING]
            > This is a testing build and may be unstable.

            - [HEX](https://github.com/${{ github.repository }}/releases/download/testing-latest/CANBoard_FW_v${{ steps.extract_version.outputs.version_dashed }}.hex)
            - [BIN](https://github.com/${{ github.repository }}/releases/download/testing-latest/CANBoard_FW_v${{ steps.extract_version.outputs.version_dashed }}.bin)
            - [ELF](https://github.com/${{ github.repository }}/releases/download/testing-latest/CANBoard_FW_v${{ steps.extract_version.outputs.version_dashed }}.elf)
            
          files: |
            build/CANBoard_FW_v${{ steps.extract_version.outputs.version_dashed }}.hex
            build/CANBoard_FW_v${{ steps.extract_version.outputs.version_dashed }}.bin
            build/CANBoard_FW_v${{ steps.extract_version.outputs.version_dashed }}.elf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
